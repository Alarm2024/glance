name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    name: Rust (glance-status)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib/rust/glance-status
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --verbose

  python:
    name: Python (glance_status)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install and test
        run: |
          pip install -e ".[dev]"
          python -m pytest -v

  posture:
    name: Posture self-test (dry / eyes-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install glance_status
        run: pip install -e lib/python
      - name: Run posture self-test
        run: python3 scripts/posture_selftest.py

  proof:
    name: CLEAR LAB proof runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run proof cases (no pip install)
        run: python3 scripts/run_proof.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gate tests + manifest parity
        run: |
          pip install -e "lib/python[dev]"
          cd lib/python && python -m pytest tests/test_gate.py tests/test_case_wording.py -v
      - name: Case wording gates
        run: python3 scripts/case_wording_selftest.py
