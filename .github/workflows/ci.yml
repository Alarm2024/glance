name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    name: Rust (glance-status)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib/rust/glance-status
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --verbose

  python:
    name: Python (glance_status)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install and test
        run: |
          pip install -e ".[dev]"
          python -m pytest -v

  posture:
    name: Posture self-test (dry / eyes-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install glance_status
        run: pip install -e lib/python
      - name: Run posture self-test
        run: python3 scripts/posture_selftest.py
