name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-rust:
    name: Test Rust before publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib/rust/glance-status
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --verbose

  test-python:
    name: Test Python before publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -e ".[dev]"
          python -m pytest -v

  publish-crates-io:
    name: Publish to crates.io
    needs: test-rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib/rust/glance-status
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN not set — skipping crates.io publish"
            exit 0
          fi
          cargo publish --allow-dirty --token "$CARGO_REGISTRY_TOKEN"

  publish-pypi:
    name: Publish to PyPI
    needs: test-python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install build twine
          python -m build
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "PYPI_API_TOKEN not set — skipping PyPI publish"
            exit 0
          fi
          twine upload dist/*
