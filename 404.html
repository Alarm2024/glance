<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1214">
  <title>Not found · Glance</title>
  <link rel="stylesheet" href="/css/style.css?v=a11y2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--font-serif:"Instrument Serif",Georgia,serif;--font-sans:"Inter",ui-sans-serif,system-ui,sans-serif}
    body{font-family:var(--font-sans)}
    .gword{font-weight:600;font-size:15px;letter-spacing:.22em;background:linear-gradient(135deg,#d8fff4 0%,#6fe0c4 44%,#9b7dff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
    .house{width:min(640px,calc(100% - 32px));margin:16px auto 0;border-radius:18px;overflow:hidden;border:1px solid var(--gold-dim)}
    .house img{display:block;width:100%;height:auto}
    .hero__title,.section__label,.card__name,.public-good__line,.footer p{font-family:var(--font-serif)}
    .topbar{display:flex;align-items:center;gap:8px}
    .header-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
    .lang-switch{display:flex;gap:3px;flex-wrap:nowrap}
  </style>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="robots" content="noindex">
  <style>
    .nf{max-width:40rem;margin:12vh auto 16vh;padding:0 1rem;text-align:center}
    .nf h1{font-size:clamp(2rem,6vw,3rem);margin:0 0 .75rem}
    .nf p{margin:0 0 1.25rem;opacity:.85}
    .nf a.home{display:inline-block;padding:.7rem 1.2rem;border-radius:999px;border:1px solid currentColor;text-decoration:none;color:var(--accent,var(--g,#2ee6c7))}
  </style>
</head>
<body>
  <div class="">
    <header class="topbar"><a class="brand" href="/">
      <span class="gmark" aria-hidden="true">G</span>
      <span class="gword">GLANCE</span>
    </a></header>
    <main id="main" class="nf">
      <h1>Page not found</h1>
      <p>That address is not on Glance. It may have moved, or the link had a typo.</p>
      <p><a class="home" href="/">Back to Glance</a></p>
    </main>
  </div>
</body>
</html>
