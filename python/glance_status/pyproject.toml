[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glance_status"
version = "0.0.0"
description = "Thin Python mirror of glance-status helpers"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["glance_status*"]
