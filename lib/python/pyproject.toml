[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "glance_status"
version = "0.0.0"
description = "Thin Python mirror of glance-status (pre-1.0 M1 skeleton)"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["glance_status*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
